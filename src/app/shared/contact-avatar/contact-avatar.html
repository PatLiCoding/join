<div
  class="avatar"
  [style.--avatar-size.px]="size"
  [style.--avatar-size-mobile.px]="mobileSize ?? size"
  [style.backgroundColor]="backgroundColor"
>
  @if (displayPhoto) {
    <div class="avatar-image-container">
      <img class="avatar-photo" [src]="displayPhoto" [alt]="contact?.name ?? 'Profile photo'" draggable="false"/>

      @if (editable) {
        <button
          type="button"
          class="remove-photo"
          (click)="removePhoto()"
          (keydown.enter)="removePhoto()"
          (keydown.space)="removePhoto(); $event.preventDefault()"
          aria-label="Remove profile picture"
        >
          <span class="icon-trigger">
            <img src="assets/imgs/add-task/trash_attachment.png" alt="" aria-hidden="true" />
          </span>
        </button>
      }
    </div>
  } @else if (hasContact) {
    <span class="avatar-initials">{{ initials }}</span>
  } @else {
    <img class="avatar-default" [src]="defaultIconUrl" alt="Person" />
  }

  @if (editable) {
    <input
      #photoInput
      type="file"
      accept="image/png, image/jpeg"
      class="visually-hidden"
      tabindex="-1"
      (change)="onPhotoSelected($event)"
    />

    <button
      type="button"
      class="avatar-edit-btn"
      aria-label="Upload profile picture"
      (click)="photoInput.click()"
      (mouseenter)="hoveredIcon = true"
      (mouseleave)="hoveredIcon = false"
      (focus)="hoveredIcon = true"
      (blur)="hoveredIcon = false"
    >
      <img
        class="avatar-edit-icon"
        [src]="
          hoveredIcon
            ? 'assets/icon/contact-info/photo_hover.png'
            : 'assets/icon/contact-info/photo.png'
        "
        alt=""
        aria-hidden="true"
        draggable="false"
      />
    </button>
  }
</div>

@if (editable) {
  <app-upload-error-toast [errorMessage]="fileError" (close)="closeError()">
  </app-upload-error-toast>
}
