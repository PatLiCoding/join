<div class="contact-selector">
  <div class="assigned-to-container">
    <div class="assigned-to-select">
      <input
        type="text"
        class="contact-search-select"
        placeholder="Select contacts to assign"
        [value]="contactSearchTerm"
        (click)="toggleDropdown()"
        (input)="onInputChange($event)"
      />

      <img
        [src]="
          isDropdownOpen
            ? 'assets/imgs/add-task/arrow_drop_up.png'
            : 'assets/imgs/add-task/arrow_drop_down.png'
        "
        class="dropdown-arrow"
        alt="Dropdown Arrow"
        (click)="toggleDropdown()"
        [alt]="isDropdownOpen ? 'Dropdown close' : 'Dropdown open'"
      />
    </div>

    <div *ngIf="selectedContacts.length > 0" class="avatars-below">
  <div class="avatar-wrapper" *ngFor="let contact of selectedContacts | slice: 0 : 3">
    <app-contact-avatar
      [contact]="contact"
      [size]="42"
      [mobileSize]="42"
      [colorOverride]="isCurrentUser(contact) ? '#4caf50' : undefined"
    />
  </div>
  <div *ngIf="selectedContacts.length > 3" class="avatar more">
    +{{ selectedContacts.length - 3 }}
  </div>
</div>

    <div *ngIf="isDropdownOpen" class="assigned-to-list">
      <div
        *ngFor="let contact of filteredContacts()"
        class="single-contact"
        [class.active]="isSelected(contact)"
        (click)="toggleContact(contact)"
      >
        <app-contact-avatar
      [contact]="contact"
      [size]="42"
      [mobileSize]="42"
      [colorOverride]="isCurrentUser(contact) ? '#4caf50' : undefined"
    />

        <span class="contact-name-wrapper">
          <span class="contact-name-text">
            {{ contact.name }}
          </span>
          <span *ngIf="isCurrentUser(contact)" class="you-label"> (You) </span>
        </span>

        <img
          [src]="
            isSelected(contact)
              ? 'assets/imgs/add-task/checkbox_active.png'
              : 'assets/imgs/add-task/checkbox_default.png'
          "
          class="checkbox-img"
          alt="Checkbox"
        />
      </div>

      <div *ngIf="filteredContacts().length === 0" class="single-contact no-contacts">
        <span>No contacts found</span>
      </div>
    </div>
  </div>
</div>
