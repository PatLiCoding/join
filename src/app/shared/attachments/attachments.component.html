<div class="attachments-component">
  <div class="attachments-header" >
    <div class="hint-delete-container">
      <p *ngIf="isEditable" class="hint-text">Allowed file types are JPEG and PNG</p>
      <button
        *ngIf="isEditable && attachments.length"
        type="button"
        class="delete-all-btn"
        (click)="deleteAllAttachments()"
        aria-label="Delete all attachments"
      >
        <img src="assets/imgs/add-task/trash.png" alt="Delete" />
        <p>Delete all</p>
      </button>
    </div>
  </div>

  <ng-container *ngIf="isEditable">
    <input
      #fileInput
      type="file"
      accept="image/png, image/jpeg"
      multiple
      (change)="onFilesSelected($event)"
      style="display: none"
    />

    <div
      class="dropzone"
      role="button"
      tabindex="0"
      [class.dragover]="isDragOver"
      aria-label="Drag a file here or press Enter to browse files"
      (click)="fileInput.click()"
      (keydown.enter)="fileInput.click()"
      (keydown.space)="fileInput.click(); $event.preventDefault()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      Drag a file or browse<img src="assets/imgs/add-task/add.png" alt="add" />
    </div>

    <div class="error-backdrop" *ngIf="fileError" (click)="closeError()"></div>
    <div class="error-toast" *ngIf="fileError" role="alert" aria-live="assertive">
      <button
        type="button"
        class="error-toast-close"
        (click)="closeError()"
        aria-label="Close the error"
      >
        <img src="assets/imgs/add-task/close_white.png" alt="Close error" />
      </button>
      <p class="error-toast-title">This file format is not allowed!</p>
      <p class="error-toast-text">{{ fileError }}</p>
    </div>
  </ng-container>

  <ul class="attachment-preview-list" #gallery *ngIf="attachments.length">
    <li
      class="attachment-thumb"
      *ngFor="let att of attachments; let i = index"
      (click)="onThumbClick(i)"
    >
      <div class="attachment-image">
        <img class="attachment-img" [src]="att.base64" [alt]="att.filename" />

        <button
          *ngIf="isEditable"
          type="button"
          class="remove-attachment"
          [attr.aria-label]="'Remove ' + att.filename"
        >
          <span class="icon-trigger" [class.is-hovering]="hoveredIconIndex === i" (mouseenter)="onIconEnter(i)" (mouseleave)="onIconLeave()">
            <img
              [src]="
                hoveredIconIndex === i
                  ? 'assets/imgs/add-task/trash_attachment_hover.png'
                  : 'assets/imgs/add-task/trash_attachment.png'
              "
              alt="Delete"
              (click)="removeAttachment(i); $event.stopPropagation()"
            />
          </span>
        </button>

        <button
          *ngIf="!isEditable"
          type="button"
          class="download-attachment"
          [attr.aria-label]="'Download ' + att.filename"
        >
          <span class="icon-trigger" [class.is-hovering]="hoveredIconIndex === i" (mouseenter)="onIconEnter(i)" (mouseleave)="onIconLeave()">
            <img
              [src]="
                hoveredIconIndex === i
                  ? 'assets/imgs/add-task/cloud_download_hover.png'
                  : 'assets/imgs/add-task/cloud_download.png'
              "
              alt="Download"
              (click)="downloadAttachment(i); $event.stopPropagation()"
            />
          </span>
        </button>

        <span class="attachment-filename" [title]="att.filename">
          {{ att.filename }}
        </span>
      </div>
    </li>
  </ul>
</div>
