<section>
  <div class="headlineContainer">
    <h1>Contacts</h1>
    <img class="borderlineDestop" src="assets/icon/contact-info/borderline.png" alt="Borderline" />
    <h3>Better with a team</h3>
    <img
      class="borderlineMobil"
      src="assets/icon/contact-info/borderline-mobil.png"
      alt="Borderline"
    />
  </div>

  <div class="backArrowBtn" [class.active]="isActive">
    <img src="assets/icon/contact-info/back-arrow.png" (click)="backToList()" alt="Back Arrow" />
  </div>

  @if (showContactContent && selectedContact; as contact) {
    <div class="contactContant">
      <div class="contactNameContainer">
        <app-contact-avatar [contact]="selectedContact" [size]="120" [mobileSize]="80"/>
        <div class="nameEditContant">
          <h2>{{ getDisplayName(contact.name) }}</h2>
          <div class="editContainer">
            <div
              class="editBox"
              (mouseenter)="hoveredIcon = 'edit'"
              (mouseleave)="hoveredIcon = null"
              (click)="editContact()"
            >
              <img
                [src]="
                  hoveredIcon === 'edit'
                    ? 'assets/icon/contact-info/edit-hover.png'
                    : 'assets/icon/contact-info/edit-default.png'
                "
                alt="Edit"
              />
              <p>Edit</p>
            </div>
            <div
              class="editBox"
              (mouseenter)="hoveredIcon = 'delete'"
              (mouseleave)="hoveredIcon = null"
              (click)="deleteContact()"
            >
              <img
                [src]="
                  hoveredIcon === 'delete'
                    ? 'assets/icon/contact-info/delete-hover.png'
                    : 'assets/icon/contact-info/delete-default.png'
                "
                alt="Delete"
              />
              <p>Delete</p>
            </div>
          </div>
        </div>
      </div>

      <div class="contactInfo">
        <h4>Contact Infomation</h4>
        <div class="emailPhoneContainer">
          <div>
            <p>Email</p>
            <a class="emailLink" [href]="'mailto:' + contact.email">
              {{ contact.email }}
            </a>
          </div>
          <div>
            <p>Phone</p>
            <a class="phoneLink" [href]="'tel:' + contact.phone">
              {{ contact.phone }}
            </a>
          </div>
        </div>
      </div>
    </div>
  }
  <div
    class="editBurgermenu"
    [class.menu-open]="menuOpen"
    (click)="toggleMenu(); $event.stopPropagation()"
  >
    <div class="preview" aria-hidden="menuOpen">
      <img src="assets/icon/contact-info/burgermenu.png" alt="burgermenu" />
    </div>
    <div class="menu" (click)="$event.stopPropagation()">
      <div
        class="editBox"
        (mouseenter)="hoveredIcon = 'edit'"
        (mouseleave)="hoveredIcon = null"
        (click)="onEditFromMenu($event)"
      >
        <img
          [src]="
            hoveredIcon === 'edit'
              ? 'assets/icon/contact-info/edit-hover.png'
              : 'assets/icon/contact-info/edit-default.png'
          "
          alt="Edit"
        />
        <p>Edit</p>
      </div>
      <div
        class="editBox"
        (mouseenter)="hoveredIcon = 'delete'"
        (mouseleave)="hoveredIcon = null"
        (click)="onDeleteFromMenu($event)"
      >
        <img
          [src]="
            hoveredIcon === 'delete'
              ? 'assets/icon/contact-info/delete-hover.png'
              : 'assets/icon/contact-info/delete-default.png'
          "
          alt="Delete"
        />
        <p>Delete</p>
      </div>
    </div>
  </div>
  <app-contact-dialog-template #contactDialog></app-contact-dialog-template>
</section>
